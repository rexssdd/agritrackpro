name: agritrack_pro
description: Firebase-powered agricultural supply POS, stock and profit tracker.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  cloud_functions: ^5.6.2
  intl: ^0.20.2
  fl_chart: ^0.70.2
  google_sign_in: 7.2.0
  image_picker: ^1.2.4
dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
