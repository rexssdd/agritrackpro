name: agritrack_pro
description: Firebase-powered agricultural supply POS, stock and profit tracker.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: 5.1.0
  firebase_auth: 7.1.0
  cloud_firestore: 7.2.0
  cloud_functions: 7.1.0
  intl: ^0.20.2
  fl_chart: ^0.70.2
  google_sign_in: 7.2.0
  image_picker: ^1.2.4
  pdf: ^3.11.3
  printing: ^5.14.2
  flutter_svg: ^2.0.17
dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/images/agritrack_logo.svg
